kind = "web"
previewPath = "/"
title = "Landry Net — Portfolio IT"
description = "Portfolio personnel premium pour Landry Kayoyo, administrateur systèmes et réseaux, présentant son expertise, ses projets vérifiables et un contact professionnel."
version = "1.0.0"
id = "apps/web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24129

[services.development]
run = "pnpm --filter @workspace/web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/web", "run", "build" ]
serve = "static"
publicDir = "apps/web/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24129"
BASE_PATH = "/"
