
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta name="theme-color" content="#0f172a" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- SEO principal -->
    <title>Landry Kayoyo | Administrateur systèmes et réseaux</title>

    <meta
      name="description"
      content="Découvrez le portfolio de Landry Kayoyo : administration systèmes et réseaux, infrastructures informatiques, sécurité, monitoring et études de cas de projets."
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta name="author" content="Landry Kayoyo" />

    <meta
      name="referrer"
      content="strict-origin-when-cross-origin"
    />

    <!-- Vérification des moteurs de recherche -->
    <meta
      name="google-site-verification"
      content="LQnzh9j2G6mO6PI3KIhbR-5Urx9A8EqqcVmSbpipTJg"
    />

    <meta
      name="google-site-verification"
      content="kgAgTNxCjc65j66hu3VKmm59gFlehDUYmtrjzE_TVE0"
    />

    <meta
      name="msvalidate.01"
      content="816B6E12517942F3474ABABC1F37A0A2"
    />

    <!-- URL canonique de la page d'accueil -->
    <link
      rel="canonical"
      href="%VITE_SITE_URL%/"
    />

    <!-- Favicon : conserver le chemin réel du projet -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <!-- Open Graph : WhatsApp, Facebook, LinkedIn, Telegram -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="LandryNet" />

    <meta
      property="og:title"
      content="Landry Kayoyo | Administrateur systèmes et réseaux"
    />

    <meta
      property="og:description"
      content="Découvrez les projets de Landry Kayoyo, ses compétences en systèmes et réseaux, ses solutions d'infrastructure IT, de sécurité et de monitoring."
    />

    <meta
      property="og:url"
      content="%VITE_SITE_URL%/"
    />

    <!-- Image de partage (1200x630 JPG, lisible par tous les réseaux) -->
    <meta
      property="og:image"
      content="%VITE_SITE_URL%/og-cover.jpg"
    />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />

    <meta
      property="og:image:alt"
      content="Landry Kayoyo — Portfolio professionnel en systèmes et réseaux"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Landry Kayoyo | Administrateur systèmes et réseaux"
    />

    <meta
      name="twitter:description"
      content="Découvrez mes projets informatiques, mes compétences techniques et mes études de cas sur LandryNet."
    />

    <meta
      name="twitter:image"
      content="%VITE_SITE_URL%/og-cover.jpg"
    />

    <meta
      name="twitter:image:alt"
      content="Portfolio professionnel de Landry Kayoyo"
    />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
