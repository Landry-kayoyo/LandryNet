
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="light" />

    <!-- SEO principal -->
    <title>Landry Kayoyo | Administrateur systèmes et réseaux</title>

    <meta
      name="description"
      content="Explorez le portfolio de Landry Kayoyo : administration systèmes et réseaux, infrastructures informatiques, cybersécurité et projets techniques."
    />

    <meta name="robots" content="index, follow, max-image-preview:large" />

    <link rel="canonical" href="https://landrynet.vercel.app/" />

    <!-- Identité du site -->
    <meta name="author" content="Landry Kayoyo" />

    <!-- Open Graph : WhatsApp, Facebook, LinkedIn, Telegram -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="LandryNet" />

    <meta
      property="og:title"
      content="Landry Kayoyo | Administrateur systèmes et réseaux"
    />

    <meta
      property="og:description"
      content="Découvrez mon univers professionnel, mes compétences en systèmes et réseaux et mes projets informatiques."
    />

    <meta
      property="og:url"
      content="https://landrynet.vercel.app/"
    />

    <!-- Crée cette image et place-la dans apps/web/public -->
    <meta
      property="og:image"
      content="https://landrynet.vercel.app/images/landrynet-social.jpg"
    />

    <meta
      property="og:image:secure_url"
      content="https://landrynet.vercel.app/images/landrynet-social.jpg"
    />

    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta
      property="og:image:alt"
      content="Landry Kayoyo — Portfolio professionnel en systèmes et réseaux"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Landry Kayoyo | Administrateur systèmes et réseaux"
    />

    <meta
      name="twitter:description"
      content="Systèmes, réseaux, infrastructures informatiques et projets techniques : découvrez mon portfolio."
    />

    <meta
      name="twitter:image"
      content="https://landrynet.vercel.app/images/landrynet-social.jpg"
    />

    <meta
      name="twitter:image:alt"
      content="Portfolio professionnel de Landry Kayoyo"
    />

    <!-- Favicon : conserver le chemin réel de ton icône -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Performance : uniquement si cette origine est réellement utilisée -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
